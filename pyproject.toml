[project]
name = "agent-container"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.10.1",
    "koda>=1.4.0",
    "koda-validate>=5.1.0",
]

[dependency-groups]
nox = [
    "nox>=2026.4.10",
]

testing = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

linting = [
    "ruff==0.15.14",
]

typing = [
    "zuban==0.8.2",
    { include-group = "testing" },
    { include-group = "nox" },
]

dev = [
    { include-group = "nox" },
    { include-group = "testing" },
    { include-group = "linting" },
    { include-group = "typing" },
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project.scripts]
agent-container = "agent_container.__main__:entrypoint"

[tool.pyright]
typeCheckingMode = "strict"

# Disabled due to being unable to distinguish functions called for their side-effects
reportUnusedCallResult = "none"

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
precision = 1

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "I",    # isort
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "PT",   # flake8-pytest-style
    "W",    # warning, pycodestyle
    "SIM",  # flake8-simplify
    "PLE",  # pylint errors
    "RUF",  # ruff specific rules
    "FURB", # refurb
]

logger-objects = [
    "LOG",
]

[tool.ruff.lint.flake8-pytest-style]

# Always require a `match` argument when using `pytest.raises()`
raises-require-match-for = [
    "*",
]

[tool.ruff.lint.per-file-ignores]

"tests/test_*.py" = [
    "S101", # assert -- Use of assert detected
    "S108", # hardcoded-temp-file -- Probable insecure usage of temporary file or dir
]
